name: Build macOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    # 关键点1：使用 macos-13，它使用的是 macOS 13 的 SDK，兼容性更好
    runs-on: macos-13
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 关键点2：使用 Go 1.20 或 1.21。不要用 1.22+，否则强制要求 macOS 11+
          go-version: '1.20'

      - name: Build for Apple Silicon (M1/M2)
        run: |
          # 关键点3：强制指定目标兼容最低版本为 10.15
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
          CGO_CFLAGS="-mmacosx-version-min=10.15" \
          CGO_LDFLAGS="-mmacosx-version-min=10.15" \
          go build -ldflags="-s -w" -o 安全助手_arm .

      - name: Build for Intel
        run: |
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
          CGO_CFLAGS="-mmacosx-version-min=10.15" \
          CGO_LDFLAGS="-mmacosx-version-min=10.15" \
          go build -ldflags="-s -w" -o 安全助手_intel .

      - name: Create Universal Binary
        run: |
          lipo -create -output 安全助手 安全助手_arm 安全助手_intel

      - name: Package as .app
        run: |
          mkdir -p "安全助手.app/Contents/MacOS"
          mkdir -p "安全助手.app/Contents/Resources"
          cp 安全助手 "安全助手.app/Contents/MacOS/"
          cp icon.ico "安全助手.app/Contents/Resources/"
          
          # 生成 Info.plist，确保 LSMinimumSystemVersion 与上面编译参数一致
          cat <<EOF > "安全助手.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>安全助手</string>
              <key>CFBundleIdentifier</key>
              <string>com.swueecg.assistant</string>
              <key>CFBundleName</key>
              <string>安全助手</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
          </dict>
          </plist>
          EOF

      - name: Zip the App
        run: |
          zip -r 安全助手_Mac版.zip "安全助手.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Installer
          path: 安全助手_Mac版.zip